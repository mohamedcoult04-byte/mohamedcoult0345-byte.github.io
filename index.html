<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul d'Argent</title>
    <style>
        /* Design inspiré de NGL avec fond bleu */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Dégradé bleu style NGL */
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            color: #333;
        }

        h2 {
            margin-top: 0;
            color: #1e3a8a;
            font-size: 1.2rem;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            background-color: #000; /* Bouton noir comme sur NGL */
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        #result {
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 1.5em;
            padding: 15px;
            border-radius: 15px;
            display: none; /* Caché par défaut */
        }

        .yako { color: #f59e0b; background: #fef3c7; }
        .late { color: #10b981; background: #d1fae5; }
        .gate { color: #ef4444; background: #fee2e2; }

    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Entrer l'argent du mois :</h2>
        <input type="number" id="argent" placeholder="Montant en FCFA..." autofocus>
        <button onclick="verifierArgent()">Envoyer</button>
        
        <div id="result"></div>
    </div>
</div>

<script>
    function verifierArgent() {
        const input = document.getElementById('argent');
        const resultDiv = document.getElementById('result');
        const x = parseInt(input.value);

        if (isNaN(x)) {
            resultDiv.style.display = "block";
            resultDiv.className = "gate";
            resultDiv.innerText = "Mets un chiffre valide !";
            return;
        }

        resultDiv.style.display = "block";

        // Logique calquée sur ton code Python
        if (x >= 1000 && x <= 10000) {
            resultDiv.className = "yako";
            resultDiv.innerText = "yako";
        } else if (x > 10000) {
            resultDiv.className = "late";
            resultDiv.innerText = "tu es un laté mon fils";
        } else {
            resultDiv.className = "gate";
            resultDiv.innerText = "c'est gaté hein";
        }
    }

    // Permet de valider avec la touche "Entrée"
    document.getElementById('argent').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            verifierArgent();
        }
    });
</script>

</body>
</html>
